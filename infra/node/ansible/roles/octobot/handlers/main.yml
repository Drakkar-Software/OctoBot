---
- name: restart stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ stack_deploy_dir }}"

- name: restart octobot
  ansible.builtin.command:
    cmd: docker compose up -d --no-deps --force-recreate octobot
    chdir: "{{ stack_deploy_dir }}"

- name: restart nginx
  ansible.builtin.command:
    cmd: docker compose restart nginx
    chdir: "{{ stack_deploy_dir }}"

- name: restart tor
  ansible.builtin.command:
    cmd: docker compose restart tor
    chdir: "{{ stack_deploy_dir }}"

- name: restart monero
  ansible.builtin.command:
    cmd: docker compose restart monerod monero-wallet-rpc
    chdir: "{{ stack_deploy_dir }}"

- name: restart bitcoin
  ansible.builtin.command:
    cmd: docker compose restart bitcoin
    chdir: "{{ stack_deploy_dir }}"

- name: restart geth
  ansible.builtin.command:
    cmd: docker compose restart geth
    chdir: "{{ stack_deploy_dir }}"
