[package]
name = "octobot_commons_py"
version = "1.10.6"
edition = "2021"

[lib]
name = "octobot_commons_py"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pymodule"]
pymodule = []

[dependencies]
octobot_commons = { path = "../octobot_commons" }
pyo3 = { version = "0.28", features = ["extension-module"] }
serde_json = "1"
