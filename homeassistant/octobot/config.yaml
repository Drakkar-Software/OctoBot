# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: OctoBot
# Placeholder only — never edit by hand. ha-publish overwrites this field on every
# tag push (see homeassistant/ci/bump-version.sh), so it always tracks the OctoBot
# git tag that triggered the release.
version: "0.0.0"
slug: octobot
description: OctoBot crypto trading bot (stable) with Node web interface
url: "https://github.com/drakkar-software/OctoBot/tree/master/homeassistant/octobot"
arch:
  - aarch64
  - amd64
init: false
ports:
  8000/tcp: 8000
  # 5001/tcp: 5001   # fallback: classic web dashboard, uncomment if node /app 404s
ports_description:
  8000/tcp: "OctoBot Node web interface"
webui: "http://[HOST]:[PORT:8000]/app"
options:
  enable_node_api: true
schema:
  enable_node_api: bool
  node_external_host: str?
image: "ghcr.io/drakkar-software/addon-octobot"
#   ^ No {arch} placeholder: both the CI builder and the Supervisor prepend the
#     arch prefix themselves (e.g. amd64-addon-octobot); a literal {arch} token
#     in this name breaks the CI build (invalid tag: double arch prefix).
#     Required for CI to know where to publish; comment out only for local
#     Supervisor builds from the Dockerfile — keep it set on main.
