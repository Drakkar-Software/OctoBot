name: OctoBot-Docker

on:
  push:
    branches:
      - master
      - dev
    tags:
      - '*'
  pull_request:

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hadolint
        uses: reviewdog/action-hadolint@v1
        with:
          github_token: ${{ secrets.github_token }}
          hadolint_ignore: DL3013 DL3008


  build-and-push:
    name: Build & Push Docker images
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Define version & target tags
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          IMG=octobot
          SHORT_SHA="${GITHUB_SHA::8}"

          echo "IMAGE=$OWNER/$IMG" >> $GITHUB_ENV

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "TAGS=latest stable $VERSION" >> $GITHUB_ENV
            echo "TENTACLES_TAG=stable" >> $GITHUB_ENV
            echo "PUSH=true" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            echo "VERSION=dev-$SHORT_SHA" >> $GITHUB_ENV
            echo "TAGS=latest-dev" >> $GITHUB_ENV
            echo "TENTACLES_TAG=latest" >> $GITHUB_ENV
            echo "PUSH=true" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/master ]]; then
            echo "VERSION=staging-$SHORT_SHA" >> $GITHUB_ENV
            echo "TAGS=staging" >> $GITHUB_ENV
            echo "TENTACLES_TAG=stable" >> $GITHUB_ENV
            echo "PUSH=true" >> $GITHUB_ENV
          else
            # PR or other → build only, no push, single tag for verification
            echo "VERSION=pr-${{ github.event.pull_request.number || 'unknown' }}-$SHORT_SHA" >> $GITHUB_ENV
            echo "TAGS=pr-$SHORT_SHA" >> $GITHUB_ENV
            echo "TENTACLES_TAG=dev" >> $GITHUB_ENV
            echo "PUSH=false" >> $GITHUB_ENV
          fi

      - name: Install Pants
        uses: pantsbuild/actions/init-pants@v10
        with:
          named-caches-hash: ${{ hashFiles('pants.toml', '**/*.lock') }}

      - name: Build multi-platform Docker image with Pants
        env:
          TENTACLES_URL_TAG: ${{ env.TENTACLES_TAG }}
        run: |
          pants package :docker

      - name: Push tags (only on push events)
        if: github.event_name == 'push' && env.PUSH == 'true'
        run: |
          # If Pants was configured to push directly → you can replace with:
          # pants publish :docker

          # Otherwise — assuming Pants built & tagged locally with a sha-like tag
          # (adjust the source tag if your Pants docker_image uses different tagging)
          SOURCE_TAG="${{ env.IMAGE }}:${{ env.VERSION }}"

          for tag in ${{ env.TAGS }}; do
            echo "Pushing ${{ env.IMAGE }}:$tag"
            docker buildx imagetools create \
              --tag "${{ env.IMAGE }}:$tag" \
              "$SOURCE_TAG"
          done

      - name: Summary
        if: always()
        run: |
          echo "Repository:   ${{ env.IMAGE }}"
          echo "Built version: ${{ env.VERSION }}"
          echo "Tags pushed:   ${{ env.TAGS }}"
          echo "Tentacles tag: ${{ env.TENTACLES_TAG }}"
          echo "Push enabled:  ${{ env.PUSH }}"


  notify-on-failure:
    if: failure()
    needs: [lint, build-and-push]
    uses: Drakkar-Software/.github/.github/workflows/failure_notify_workflow.yml@master
    secrets:
      DISCORD_GITHUB_WEBHOOK: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}


  notify-on-new-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [lint, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification – new Docker tag
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          description: "@here New OctoBot Docker image published → **${{ github.ref_name }}**\nTags: latest, stable, ${{ github.ref_name }}"
