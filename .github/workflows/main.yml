name: OctoBot-CI
on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:

jobs:
  binary:
    # needs: [ tests ]
    name: ${{ matrix.os }} - ${{ matrix.arch }} - Python 3.13 - build
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ macos-13, windows-latest, ubuntu-latest ] # todo restore macos to latest once python major is updated
        os: [windows-latest]
        arch: [ x64, arm64 ]
        exclude:
          - os: macos-13
            arch: arm64
          - os: windows-latest
            arch: arm64

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.x'
        architecture: x64

    - name: Build OctoBot Binary on Linux arm64
      if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
      uses: uraimo/run-on-arch-action@v2.8.1
      with:
        arch: aarch64
        distro: ubuntu22.04
        githubToken: ${{ github.token }}
        env: |
          OCTOBOT_REPOSITORY_DIR: OctoBot
          NLTK_DATA: nltk_data
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3.13 python3-pip python3-dev git gcc musl-dev libc-dev build-essential zlib1g zlib1g-dev
          curl --proto '=https' --tlsv1.2 -fsSL https://static.pantsbuild.org/setup/get-pants.sh | bash
          python3 -m pip install -U pip setuptools wheel
          pants package :OctoBot
          pip3 install dist/octobot-*.whl
          bash ./packages/binary/build_scripts/unix.sh

    - name: Build OctoBot Binary on Linux
      if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
      env:
        OCTOBOT_REPOSITORY_DIR: OctoBot
        NLTK_DATA: nltk_data
        BUILD_ARCH: ${{ matrix.arch }}
      run: |
        curl --proto '=https' --tlsv1.2 -fsSL https://static.pantsbuild.org/setup/get-pants.sh | bash
        python3 -m pip install -U pip setuptools wheel
        pants package :OctoBot
        pip3 install dist/octobot-*.whl
        bash ./packages/binary/build_scripts/unix.sh

    - name: Build OctoBot Binary on MacOS
      if: matrix.os == 'macos-13'
      env:
        OCTOBOT_REPOSITORY_DIR: OctoBot
        NLTK_DATA: nltk_data
        BUILD_ARCH: ${{ matrix.arch }}
      run: |
        curl --proto '=https' --tlsv1.2 -fsSL https://static.pantsbuild.org/setup/get-pants.sh | bash
        python3 -m pip install -U pip setuptools wheel
        pants package :OctoBot
        pip3 install dist/octobot-*.whl
        bash ./packages/binary/build_scripts/unix.sh

    - name: Build OctoBot Binary on Windows
      if: matrix.os == 'windows-latest'
      env:
        OCTOBOT_REPOSITORY_DIR: OctoBot
        NLTK_DATA: nltk_data
      run: |
        curl --proto '=https' --tlsv1.2 -fsSL https://static.pantsbuild.org/setup/get-pants.sh | bash
        python -m pip install -U pip setuptools wheel
        pants package :OctoBot
        python -m pip install dist/octobot-*.whl
        .\packages\binary\build_scripts\windows.ps1
      shell: powershell

    - name: Upload OctoBot Binary on MacOS
      uses: actions/upload-artifact@v6
      if: matrix.os == 'macos-13'
      with:
        name: OctoBot_macos_${{ matrix.arch }}
        path: OctoBot/OctoBot_${{ matrix.arch }}
        if-no-files-found: error

    - name: Upload OctoBot Binary on Linux
      uses: actions/upload-artifact@v6
      if: matrix.os == 'ubuntu-latest'
      with:
        name: OctoBot_linux_${{ matrix.arch }}
        path: OctoBot/OctoBot_${{ matrix.arch }}
        if-no-files-found: error

    - name: Upload OctoBot Binary on Windows
      uses: actions/upload-artifact@v6
      if: matrix.os == 'windows-latest'
      with:
        name: OctoBot_windows_${{ matrix.arch }}.exe
        path: OctoBot/dist/OctoBot_windows.exe
        if-no-files-found: error

  notify:
    if: ${{ failure() }}
    needs:
      - binary
    uses: Drakkar-Software/.github/.github/workflows/failure_notify_workflow.yml@master
    secrets:
      DISCORD_GITHUB_WEBHOOK: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
