name: Launcher Release

on:
  push:
    tags:
      - "launcher-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-13
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.gz
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.gz
            use_cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.use_cross == true
        working-directory: packages/launcher
        env:
          LAUNCHER_UPDATE_PUBKEY_HEX: ${{ secrets.LAUNCHER_UPDATE_PUBKEY_HEX }}
        run: cross build --release -p octobot-launcher-cli --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.use_cross != true
        working-directory: packages/launcher
        env:
          LAUNCHER_UPDATE_PUBKEY_HEX: ${{ secrets.LAUNCHER_UPDATE_PUBKEY_HEX }}
        run: cargo build --release -p octobot-launcher-cli --target ${{ matrix.target }}

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#launcher-v}" >> "$GITHUB_OUTPUT"

      - name: Pack archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN=packages/launcher/target/${{ matrix.target }}/release/octobot-launcher
          strip "$BIN" 2>/dev/null || true
          ARCHIVE="octobot-launcher-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" octobot-launcher
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
        id: pack_unix

      - name: Pack archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        id: pack_win
        run: |
          $bin = "packages/launcher/target/${{ matrix.target }}/release/octobot-launcher.exe"
          $version = "${{ steps.version.outputs.version }}"
          $archive = "octobot-launcher-${version}-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ASCII "${archive}.sha256"
          echo "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            octobot-launcher-*.${{ matrix.archive }}
            octobot-launcher-*.${{ matrix.archive }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          cat *.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Detect prerelease
        id: prerelease
        run: |
          if echo "$GITHUB_REF_NAME" | grep -qE '\-(rc|beta|alpha)[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          generate_release_notes: true
          files: |
            octobot-launcher-*.tar.gz
            octobot-launcher-*.tar.gz.sha256
            octobot-launcher-*.zip
            octobot-launcher-*.zip.sha256
            SHA256SUMS
