[build-system]
requires = ["setuptools>=79.0.1,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "octobot"
dynamic = ["version"]
description = "Cryptocurrencies alert / trading bot"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Drakkar-Software", email = "contact@drakkar.software" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Core runtime
    "requests==2.34.2", # sync with ccxt
    "urllib3",
    "packaging==26.3",
    "python-dotenv==1.2.2",
    "setuptools==79.0.1", # setuptools>=80 breaks easy_install
    "cachetools==7.2.0",
    "standard-imghdr==3.13.0",
    "pgpy==0.6.0",
    "sentry-sdk==2.70.0",
    "supabase==2.31.0",
    "supabase_auth",
    "postgrest",
    "websockets==15.0.1",
    "aiohttp==3.14.3",
    "aiofiles==25.1.0",
    "aiodns==3.1.1",

    # Commons and evaluators
    "numpy==2.4.2", # sync with octobot-tulipy
    "cryptography",
    "sortedcontainers==2.4.0",
    "pydantic==2.13.5",
    "OctoBot-Tulipy>=0.4.11b13",

    # Node and protocol
    "fastapi==0.141.0",
    "uvicorn==0.53.0",
    "starlette==1.7.0",
    "passlib[bcrypt]==1.7.4",
    "dbos==3.0.0",
    "typing_extensions",

    # Sync
    "starfish-sdk==3.0.0a72",
    "starfish-identities==3.0.0a72",
    "starfish-protocol==3.0.0a72",
    "starfish-keyring==3.0.0a72",
    "starfish-spaces==3.0.0a72",
    "starfish-sharing==3.0.0a72",
    "python-multipart",
    "web3==7.16.0",

    # Trading
    "octobot-ccxt==0.0.14",
]

[project.optional-dependencies]
full = [
    "colorlog==6.10.1",
    "gmqtt==0.7.0",
    "clickhouse-connect==0.10.0",
    "protobuf==6.33.5",
    "jsonschema==4.26.0",
    "psutil==7.2.2",
    "certifi==2026.6.17", # sync with ccxt
    "tinydb==4.8.2",
    "aiosqlite==0.17.0",
    "asyncpraw==8.0.3",
    "python-telegram-bot==22.8",
    "simplifiedpytrends>=1.1.2",
    "pyngrok==7.5.0",
    "flask==3.1.3",
    "werkzeug==3.1.8",
    "jinja2==3.1.6",
    "flask-login==0.6.3",
    "flask-cors==6.0.5",
    "WTForms==3.2.2",
    "Flask-WTF==1.3.0",
    "asgiref==3.12.1",
    "openai==2.20.0",
    "mcp==1.27.2",
    "coingecko-openapi-client==1.4.0",
    "vaderSentiment==3.3.2",
    "starfish-replica[space]==3.0.0a72",
    "starfish-server==3.0.0a25",
    "cython==0.29.32",
    "pyyaml==6.0.3",
    "aioboto3==15.5.0",
]
socks = [
    "aiohttp_socks==0.11.0",
]
binary = [
    "pyinstaller==6.22.3",
    "nltk",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "mock>=4.0.1",
    "twine",
    "pip",
    "setuptools",
    "wheel",
    "pur",
    "pylint",
    "ruff==0.16.7",
    "PyYAML==6.0.3",
]

[project.scripts]
OctoBot = "octobot.cli:main"

[project.urls]
Homepage = "https://github.com/Drakkar-Software/OctoBot"

[tool.setuptools]
py-modules = ["start"]

[tool.setuptools.dynamic]
version = { attr = "octobot.VERSION" }

[tool.setuptools.packages.find]
where = [
    ".",
    "packages/agents",
    "packages/async_channel",
    "packages/backtesting",
    "packages/commons",
    "packages/copy",
    "packages/evaluators",
    "packages/flow",
    "packages/node",
    "packages/protocol",
    "packages/services",
    "packages/sync",
    "packages/tentacles_manager",
    "packages/trading",
]
include = ["octobot*", "async_channel*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["**/*.pxd"]
octobot = [
    "config/**/*",
    "strategy_optimizer/optimizer_data_files/**/*",
]
octobot_tentacles_manager = [
    "creators/templates/**/*",
]
