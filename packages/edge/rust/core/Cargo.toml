[package]
name = "octobot-edge-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "octobot_edge_core"

[dependencies]
hmac = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
md-5 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "blocking"] }
