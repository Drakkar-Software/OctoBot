[workspace]
resolver = "2"
members = ["core", "wasm", "napi", "py", "mobile"]

[workspace.dependencies]
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
base64 = { version = "0.22", features = ["alloc"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
