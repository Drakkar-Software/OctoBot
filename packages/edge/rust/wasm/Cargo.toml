[package]
name = "octobot-edge-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
octobot-edge-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
hex = { workspace = true }
base64 = { workspace = true }
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["console"] }
