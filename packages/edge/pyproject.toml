[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octobot-edge"
version = "0.1.0"
description = "Universal CCXT wrapper with Rust-accelerated signing"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["octobot_edge*"]
