[package]
name = "octobot-connectors-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "octobot_connectors_core"
crate-type = ["lib"]

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rust_decimal = { version = "1", features = ["serde-float"] }
log = "0.4"
ccxt = { git = "https://github.com/Drakkar-Software/ccxt", branch = "feature/add-rust", features = ["full-exchanges"] }

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
