[package]
name = "octobot-connectors-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
octobot-connectors-core = { path = "../octobot_connectors_core" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }
pyo3-asyncio-0_21 = { version = "0.22", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
rust_decimal = "1"

[features]
extension-module = ["pyo3/extension-module"]
